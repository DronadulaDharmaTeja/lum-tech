
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LUM TEK Admin{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202938;
        }

        .sidebar {
            width: 245px;
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            top: 0;
            left: 0;
            background: #142033;
            color: white;
            padding: 25px 16px;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            margin: 0 10px 30px;
        }

        .brand span {
            color: #f59e0b;
        }

        .sidebar a {
            display: block;
            color: #dbe4f0;
            text-decoration: none;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 7px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #263850;
            color: white;
        }

        .main {
            margin-left: 245px;
            padding: 30px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 12px;
        }

        .muted {
            color: #718096;
        }

        .logout-button {
            background: #dc3545;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
        }

        @media (max-width: 750px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

{% if current_user.is_authenticated %}
<aside class="sidebar">
    <div class="brand">LUM <span>TEK</span></div>

    <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin.projects') }}">Projects</a>
    <a href="{{ url_for('admin.services') }}">Services</a>
    <a href="{{ url_for('admin.testimonials') }}">Testimonials</a>
    <a href="{{ url_for('admin.leads') }}">Quote Requests</a>
    <a href="{{ url_for('admin.project_tracker') }}">Project Tracker</a>
    <a href="{{ url_for('admin.media_library') }}">Media Library</a>
    <a href="{{ url_for('admin.contact_hub') }}">Contact Hub</a>
    <a href="{{ url_for('admin.seo_settings') }}">SEO Settings</a>
    <a href="{{ url_for('admin.backups') }}">Backups</a>

    {% if current_user.role == "admin" %}
    <a href="{{ url_for('admin.users') }}">User Management</a>
    {% endif %}
</aside>
{% endif %}

<main class="main">
    {% block content %}{% endblock %}
</main>

</body>
</html>
